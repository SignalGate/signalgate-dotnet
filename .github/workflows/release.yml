name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "refs/tags/${GITHUB_REF_NAME}" refs/remotes/origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main."
            exit 1
          fi

      - name: Check that every version matches the tag
        id: version
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not of the form vX.Y.Z."
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(dotnet msbuild src/SignalGate/SignalGate.csproj -getProperty:Version)
          sdk_version=$(sed -n 's/^ *internal const string SdkVersion = "\([^"]*\)";.*$/\1/p' src/SignalGate/Internal/UserAgent.cs)
          changelog_version=$(grep -m 1 '^## ' CHANGELOG.md | sed -n 's/^## \[\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\].*$/\1/p')
          echo "tag: ${tag_version}"
          echo "project: ${project_version}"
          echo "SDK: ${sdk_version}"
          echo "changelog: ${changelog_version}"
          if [ "${project_version}" != "${tag_version}" ] \
            || [ "${sdk_version}" != "${tag_version}" ] \
            || [ "${changelog_version}" != "${tag_version}" ]; then
            echo "The versions do not all match the tag."
            exit 1
          fi
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: Check that the changelog entry is dated
        run: |
          heading=$(grep -m 1 '^## ' CHANGELOG.md)
          if ! [[ "${heading}" =~ ^##\ \[[0-9.]+\]\ -\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "The top changelog heading must read '## [X.Y.Z] - YYYY-MM-DD', found: ${heading}"
            exit 1
          fi

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found && /^\[.*\]: / { next }
            found { print }
          ' CHANGELOG.md > "${notes}"
          if ! grep -q '[^[:space:]]' "${notes}"; then
            echo "CHANGELOG.md has no notes for ${VERSION}."
            exit 1
          fi
          cat "${notes}"

      - name: Build
        run: dotnet build SignalGate.slnx -c Release

      - name: Test (net8.0 and net10.0)
        run: dotnet test --solution SignalGate.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/SignalGate/SignalGate.csproj -c Release -o artifacts --no-build

      - name: Verify package output
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected=$(printf '%s\n' "SignalGate.${VERSION}.nupkg" "SignalGate.${VERSION}.snupkg")
          actual=$(ls artifacts | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected package output:"
            echo "$actual"
            exit 1
          fi

      # Trusted publishing: exchanges the workflow's identity token for a short-lived API key.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # The symbol package next to the .nupkg is pushed with it.
      - name: Push to nuget.org
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/SignalGate.${VERSION}.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag
